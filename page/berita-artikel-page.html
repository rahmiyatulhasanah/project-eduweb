<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="../style.css" />
    <link rel="icon" type="image/x-icon" href="/img/E.svg" />
    <title>Artikel dan Berita</title>

    <style>
      .imageplaceholder {
        margin: 20px 100px;
        padding: 0px;
        background-color: #00000000;
      }

      .pict {
        width: 100%;
        object-fit: cover;
      }

      .textplaceholder {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .pisi {
        width: 65%;
        font-size: 14px;
        line-height: 28px;
      }

      .title {
        margin-bottom: 40px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <header></header>
    <main>
      <section class="imageplaceholder">
        <img src="../img/AI.webp" alt="AI" class="pict" />
      </section>

      <section class="textplaceholder">
        <h1 class="title"></h1>
        <p class="pisi"></p>
      </section>
    </main>
    <footer></footer>

    <script src="../js/header_footer.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const selectedArticle = JSON.parse(
          localStorage.getItem("selectedArticle")
        );

        if (selectedArticle) {
          const imgElement = document.querySelector(".imageplaceholder img");
          imgElement.src = selectedArticle.img;
          imgElement.alt = selectedArticle.alt;

          const titleElement = document.querySelector(".title");
          titleElement.textContent = selectedArticle.title;

          const contentElement = document.querySelector(".pisi");
          contentElement.innerHTML = selectedArticle.content.replace(
            /\n/g,
            "<br><br>"
          );
        }
      });
    </script>
  </body>
</html>
